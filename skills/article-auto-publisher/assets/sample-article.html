<h1>AI BI 系统内容运营测试文章</h1>
<p>这是一篇用于本地联调的测试文章，用来验证自动撰写与发布链路是否已经打通。</p>
<h2>为什么先做本地 MVP</h2>
<p>本地 MVP 可以先验证登录、分类查询、文章创建与结果回显，等链路稳定后再接入更复杂的选题、审核与定时发布能力。</p>
<h2>当前验证范围</h2>
<ul>
  <li>使用管理员账号自动登录并获取 token。</li>
  <li>查询文章分类并选择目标分类。</li>
  <li>提交 HTML 正文到文章接口。</li>
  <li>返回创建成功结果，便于继续联调。</li>
</ul>
<p>如果这篇文章能成功进入后台文章列表，就说明第一版自动发布 MVP 已经具备继续演进的基础。</p>
